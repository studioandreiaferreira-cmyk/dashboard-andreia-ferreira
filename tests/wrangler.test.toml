# Test-only Worker config: the sync and metrics code runs against a local D1 in tests
# (production runs on Supabase/Postgres and in the browser, see specs/002-static-supabase).
name = "af-crm-dashboard-test"
main = "../src/test-worker.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "crm-andreia-test"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../migrations"

[vars]
BUSINESS_HOURS = '{"days":[1,2,3,4,5],"start":"09:00","end":"18:00","tz":"America/Sao_Paulo"}'
NO_REPLY_MINUTES = "60"
MESSAGE_WINDOW_DAYS = "90"
PROFILE_FIELDS = '[{"key":"faturamento_mensal","label":"Faturamento mensal","entity":"deal"},{"key":"role","label":"Profissão","entity":"contact"}]'
CLINT_DEAL_URL_TEMPLATE = ""
CLINT_CHAT_URL_TEMPLATE = ""
